# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use Android Studio JBR (Cursor/VS Code JRE lacks jlink and breaks AGP compile).
# Override in gradle.properties.local on other machines if needed.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Android optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.bundle.enableUnusedResourcesCheck=true

# Kotlin code style
kotlin.code.style=official
